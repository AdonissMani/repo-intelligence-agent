name: identity-core
team: Identity Platform
business_unit: Core Platform
domain: identity and access
type: service
provides:
  - authentication
  - authorization
  - token issuance
  - service identity
apis:
  - POST /v1/auth/token
  - GET /v1/users/{id}
  - POST /v1/authorization/check
depends_on:
  - customer-profile
  - notification-core
consumed_by:
  - checkout-service
  - merchant-service
  - loan-orchestrator
  - subscription-service
publishes:
  - UserCreated
  - IdentityVerified
subscribes: []
data_owned:
  - service credentials
  - identity verification status
criticality: high
