[project]
name = "enterprise-repo-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "pgvector>=0.2",
  "pyyaml>=6",
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
